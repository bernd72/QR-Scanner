<!doctype html>
<html lang="de">
<head>

<style>
:root{color-scheme:dark;--bg:#0c1524;--panel:#142238;--line:#344763;--text:#f2f7ff;--muted:#a7b9d2;--blue:#187dff}
*{box-sizing:border-box}html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
button,input{font-family:inherit;font-size:16px}button{appearance:none;-webkit-appearance:none;min-height:44px;border:1px solid #3d526f;border-radius:10px;color:var(--text);background:#263a56;font-weight:600;padding:8px 9px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:active{filter:brightness(1.18)}button:disabled{opacity:.45;cursor:default}.primary,.selected{background:#1478ed!important;border-color:#258aff!important}
[hidden]{display:none!important}
.app{width:min(100%,620px);height:100vh;height:100svh;max-height:100svh;padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 4px);display:flex;flex-direction:column;gap:6px;margin:0 auto;overflow:hidden;contain:layout}
.header{height:29px;min-height:29px;display:flex;align-items:center;justify-content:space-between;gap:6px}.header h1{margin:0;font-size:19px;letter-spacing:-.3px;white-space:nowrap}.status{font-size:11px;color:#b2c8e5;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:7px}.tabs button{min-height:43px}
.viewer{position:relative;flex:1 1 0;min-height:115px;border-radius:13px;overflow:hidden;border:1px solid #3c506d;background:#040914;touch-action:none}
#video,#preview{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}#video{z-index:0}#preview{z-index:1;touch-action:none;pointer-events:none}#viewer.photo #preview{pointer-events:auto}
#video{transform-origin:center;pointer-events:none}
.hint{position:absolute;bottom:5px;left:6px;right:6px;padding:7px 9px;border-radius:8px;background:#0e1b30dc;z-index:3;text-align:center;font-size:12px;color:#ebf3ff;pointer-events:none;max-height:60px;overflow:hidden}
.busy{display:none;position:absolute;top:7px;right:7px;padding:6px 9px;border-radius:7px;background:#243d61e6;font-size:12px;z-index:5}.busy.on{display:block}
.focus{display:none;position:absolute;width:48px;height:48px;border:2px solid #17cfff;border-radius:8px;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 999px #0000;z-index:4}.focus.on{display:block}
.selectionBox{display:none;position:absolute;border:2px solid #00dbff;background:#17baff22;z-index:4;pointer-events:none;border-radius:4px;box-shadow:0 0 0 1px #071b35}.selectionBox.on{display:block}
.matchPanel{position:absolute;top:4px;left:4px;right:4px;z-index:6;display:none;max-height:52%;overflow:auto;background:#09172be9;border:1px solid #507ba7;padding:7px;border-radius:11px}.matchPanel.on{display:block}.matchPanel button{display:block;width:100%;text-align:left;margin:4px 0;font-size:14px;overflow-wrap:anywhere}
.controls{flex:none;min-height:100px;display:flex;flex-direction:column;gap:5px}.controlRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.controlRow button{font-size:14px;white-space:nowrap;padding:8px 4px}
.controlRow.photoRow button{font-size:13px}.controlRow.photoRowWide{grid-template-columns:1fr 1fr 1fr}
.selectionRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.selectionRow button{font-size:13px;padding:7px 3px;min-height:39px}.selectionRow button.active{background:#126e9b;border-color:#37b9ec}
.zoomBar{display:flex;align-items:center;gap:6px;height:45px;min-height:45px;background:#192942;border-radius:10px;padding:3px 6px}
.zoomBar button{min-width:43px;height:43px}.zoomBar input{flex:1;min-width:0;accent-color:#1688ff;touch-action:pan-x}.zoomBar output{font-size:13px;min-width:37px;text-align:right}.zoomBar label{font-size:12px;white-space:nowrap}
.controlInfo{flex:1;font-size:12px;color:#afc4dc;display:flex;align-items:center;justify-content:center;text-align:center;background:#17263c;border-radius:9px;min-height:45px;padding:7px}
.history{flex:0 0 27%;min-height:120px;display:flex;flex-direction:column;gap:3px;min-width:0}.historyTop{display:flex;align-items:center;justify-content:space-between;flex:none;min-height:34px}.historyTop h2{font-size:14px;margin:0}.historyTop button{min-height:33px;padding:4px 8px;font-size:13px;background:#763842}
.entries{flex:1;overflow:auto;overscroll-behavior:contain;background:#122037;border:1px solid var(--line);border-radius:9px}.entry{padding:7px;border-bottom:1px solid #304057;display:grid;gap:5px}.entry:last-child{border-bottom:0}.entryMeta{color:#b3c4df;font-size:12px}.entryValue{overflow-wrap:anywhere;font-size:13px}.entry input{width:100%;height:40px;min-height:40px;background:#1a2c46;color:#fff;border:1px solid #4b6182;border-radius:7px;padding:6px 9px;font-size:16px}.empty{padding:12px;text-align:center;color:var(--muted)}
.footer{flex:none;height:15px;font-size:11px;color:#91a4bd;text-align:center}
.rotate{display:none}
@media(orientation:landscape) and (pointer:coarse){.app{display:none}.rotate{display:grid;height:100svh;place-items:center;text-align:center;padding:24px;font-size:20px}}
@media(max-height:660px) and (orientation:portrait){.app{gap:4px;padding-top:calc(env(safe-area-inset-top) + 3px)}.controls{min-height:96px}.history{flex-basis:25%;min-height:106px}.hint{font-size:11px;padding:4px}.tabs button{min-height:40px}.controlRow button{min-height:40px}.zoomBar{height:42px;min-height:42px}.zoomBar button{height:40px;min-height:40px}}
</style>

<body>
<div class="rotate">Bitte das Gerät ins Hochformat drehen.</div>
<main class="app" id="app">
<header class="header"><h1>QR Scanner</h1><span class="status" id="status">Erkennung startet …</span></header>
<nav class="tabs"><button id="tabCamera" class="selected">Kamera</button><button id="tabPhoto">Bild auswählen</button></nav>
<section class="viewer" id="viewer">
<video id="video" playsinline muted></video>
<canvas id="preview"></canvas>
<div class="focus" id="focus"></div><div class="selectionBox" id="selectionBox"></div>
<div class="busy" id="busy">Untersuche Bild …</div>
<div class="matchPanel" id="matches"></div>
<div class="hint" id="hint">Kamera einschalten, dann Scan starten</div>
</section>
<section class="controls">
 <div id="cameraControls">
  <div class="controlRow"><button id="cameraOn">Kamera ein</button><button id="startScan" class="primary">Scan starten</button><button id="nextScan">Weiter</button></div>
 </div>
 <div id="photoControls" hidden>
  <div class="controlRow photoRow"><button id="pickPhoto" class="primary">Bild öffnen</button><button id="scanWhole">Ganzes Bild</button><button id="scanCrop">Sichtbereich</button></div>
  <div class="selectionRow"><button id="selectArea">Bereich markieren</button><button id="scanArea" disabled>Bereich scannen</button><button id="clearArea">Markierung weg</button></div>
 </div>
 <div class="zoomBar" id="zoomCamera"><button id="cameraMinus">−</button><label for="camRange">Zoom</label><input id="camRange" type="range" min="1" max="5" step="0.1" value="1"><button id="cameraPlus">+</button><output id="camValue">1,0×</output></div>
 <div class="zoomBar" id="zoomPhoto" hidden><button id="photoMinus">−</button><label for="photoRange">Foto</label><input id="photoRange" type="range" min="1" max="12" step="0.1" value="1"><button id="photoPlus">+</button><output id="photoValue">1,0×</output></div>
</section>
<input id="file" type="file" accept="image/*" hidden>
<section class="history">
<div class="historyTop"><h2>Letzte Scans (<span id="count">0</span>/10)</h2><button id="clearHistory">Puffer löschen</button></div>
<div class="entries" id="entries"></div>
</section>
<footer class="footer">QR &amp; Data Matrix · V1.1</footer>
</main>
<script src="zxing.min.js?v=1.1"></script><script src="scanner-engine.js?v=1.1"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const viewer=$('viewer'),canvas=$('preview'),ctx=canvas.getContext('2d',{willReadFrequently:true}),video=$('video');
const buffer=document.createElement('canvas'),bctx=buffer.getContext('2d',{willReadFrequently:true});
let mode='camera',cameraStream=null,scanning=false,locked=false,raf=0,lastFrame=0,frameCount=0;
let photo=null,photoZoom=1,panX=0,panY=0,camZoom=1,points=new Map(),origins=new Map(),lastGap=0,photoLoadToken=0;
let worker=null,jobId=0,job=null,epoch=0;let records=[],seq=0;let areaMode=false,selectedArea=null,areaStart=null;
try{records=JSON.parse(localStorage.getItem('qrRecords')||'[]');if(!Array.isArray(records))records=[];seq=Number(localStorage.getItem('qrSeq')||0)}catch{}
function status(s){$('status').textContent=s}
function hint(s){$('hint').textContent=s}
function busy(on){$('busy').classList.toggle('on',on)}
function persist(){try{localStorage.setItem('qrRecords',JSON.stringify(records));localStorage.setItem('qrSeq',String(seq))}catch{status('Speichern nicht möglich')}}
function render(){
 $('count').textContent=records.length;const list=$('entries');list.replaceChildren();
 if(!records.length){const e=document.createElement('div');e.className='empty';e.textContent='Noch keine Scans';list.append(e);return}
 for(const rec of [...records].reverse()){
  const row=document.createElement('div');row.className='entry';
  const meta=document.createElement('div');meta.className='entryMeta';meta.textContent='#'+rec.id+' · '+rec.time+' · '+(rec.format||'Code');
  const val=document.createElement('div');val.className='entryValue';val.textContent=rec.value;
  const note=document.createElement('input');note.type='text';note.placeholder='Bemerkung';note.value=rec.note||'';
  note.addEventListener('input',()=>{rec.note=note.value;persist()});
  row.append(meta,val,note);list.append(row);
 }
}
render();
function newWorker(){
 if(worker){worker.terminate();worker=null}
 worker=new Worker('./scan-worker.js?v=1.1');
 worker.onmessage=e=>{if(!job||e.data.id!==job.id)return;const f=job;job=null;busy(false);e.data.error?f.reject(Error(e.data.error)):f.resolve(e.data)};
 worker.onerror=e=>{if(!job)return;const f=job;job=null;busy(false);f.reject(Error('Worker: '+e.message))};
}
try{newWorker()}catch(e){status('Worker nicht verfügbar')}
function abortDecode(){
 epoch++;
 if(job){job.reject(Error('abgebrochen'));job=null;busy(false)}
 if(worker){try{newWorker()}catch(e){worker=null}}
}
function decode(source,profile){
 if(!worker)return Promise.reject(Error('Offline-Decoder konnte nicht gestartet werden'));
 if(job)return Promise.reject(Error('Decoder beschäftigt'));
 const w=source.width,h=source.height;const rgba=source.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h);
 busy(true);const id=++jobId;
 return new Promise((resolve,reject)=>{
  job={id,resolve,reject};worker.postMessage({id,width:w,height:h,profile,data:rgba.data.buffer},[rgba.data.buffer]);
 });
}
function measured(){const r=viewer.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);return {w:Math.max(1,Math.round(r.width*d)),h:Math.max(1,Math.round(r.height*d))}}
function sizePreview(){const {w,h}=measured();if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}}
function clearPreview(){sizePreview();ctx.clearRect(0,0,canvas.width,canvas.height)}
function clearArea(){selectedArea=null;areaStart=null;areaMode=false;$('selectionBox').classList.remove('on');$('selectArea').classList.remove('active');$('scanArea').disabled=true}
function photoCoords(px,py){const q=fitPhoto(),rect=canvas.getBoundingClientRect();const vx=(px-rect.left)*canvas.width/rect.width,vy=(py-rect.top)*canvas.height/rect.height;return {x:Math.max(0,Math.min(photo.width,(vx-q.l)/q.scale)),y:Math.max(0,Math.min(photo.height,(vy-q.t)/q.scale))}}
function drawArea(){const el=$('selectionBox');if(!selectedArea||!photo||mode!=='photo'){el.classList.remove('on');return}
 const q=fitPhoto(),r=canvas.getBoundingClientRect();const x=Math.max(0,q.l+selectedArea.x*q.scale),y=Math.max(0,q.t+selectedArea.y*q.scale);
 const rx=Math.min(canvas.width,q.l+(selectedArea.x+selectedArea.w)*q.scale),ry=Math.min(canvas.height,q.t+(selectedArea.y+selectedArea.h)*q.scale);
 el.style.left=(x/canvas.width*100)+'%';el.style.top=(y/canvas.height*100)+'%';el.style.width=(Math.max(0,rx-x)/canvas.width*100)+'%';el.style.height=(Math.max(0,ry-y)/canvas.height*100)+'%';el.classList.add('on')}
function setArea(a,b){selectedArea={x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)};$('scanArea').disabled=selectedArea.w<12||selectedArea.h<12;drawArea()}

function hideMatches(){$('matches').classList.remove('on');$('matches').replaceChildren()}
function save(r){
 if(!r||!r.value)return;
 records.push({id:++seq,time:new Date().toLocaleString('de-DE'),value:r.value.replace(/[\r\n]+$/,''),format:r.format,note:''});records=records.slice(-10);persist();render();hideMatches();status('Code gespeichert · V1.1');hint('Gespeichert. Nächsten Code über „Weiter“ oder neues Foto scannen.');
}
function showResults(res){
 if(!res||!res.length)return false;
 hideMatches();if(res.length===1){save(res[0]);return true}
 const p=$('matches');p.classList.add('on');const t=document.createElement('div');t.textContent=res.length+' Codes gefunden – bitte auswählen:';p.append(t);
 for(const [i,r] of res.entries()){
  const btn=document.createElement('button');btn.textContent=(i+1)+'. '+r.format+' · '+r.value.slice(0,110);btn.onclick=()=>save(r);p.append(btn);
 }
 hint('Mehrere Codes erkannt. Bitte einen auswählen.');return true;
}
function stopCamera(){scanning=false;cancelAnimationFrame(raf);if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}video.srcObject=null}
async function openCamera(){
 stopCamera();abortDecode();locked=false;video.style.visibility='visible';clearPreview();
 hint('Kamera wird geöffnet …');status('Öffne Kamera …');
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw Error('Für die Kamera ist HTTPS erforderlich');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  if(mode!=='camera'){stream.getTracks().forEach(t=>t.stop());return}
  cameraStream=stream;video.srcObject=stream;await video.play();setCameraZoom(camZoom);status('Kamera bereit · V1.1');hint('Zoom einstellen, dann „Scan starten“ drücken');
 }catch(e){status('Kamera nicht bereit');hint('Kamerafehler: '+e.message)}
}
function setCameraZoom(v){camZoom=Math.max(1,Math.min(5,Math.round(Number(v)*10)/10));$('camRange').value=String(camZoom);$('camValue').textContent=camZoom.toFixed(1).replace('.',',')+'×';video.style.transform='scale('+camZoom+')'}
function cameraShot(){
 if(!video.videoWidth)return null;
 const cw=video.videoWidth/chosenCamZoom(),ch=video.videoHeight/chosenCamZoom(),sx=(video.videoWidth-cw)/2,sy=(video.videoHeight-ch)/2;
 const factor=Math.min(1,1700/Math.max(cw,ch));buffer.width=Math.max(1,Math.round(cw*factor));buffer.height=Math.max(1,Math.round(ch*factor));
 bctx.drawImage(video,sx,sy,cw,ch,0,0,buffer.width,buffer.height);return buffer;
}
function chosenCamZoom(){return camZoom}
function freezeCamera(){
 const s=cameraShot();if(s){sizePreview();ctx.clearRect(0,0,canvas.width,canvas.height);const fit=Math.min(canvas.width/s.width,canvas.height/s.height),w=s.width*fit,h=s.height*fit;ctx.drawImage(s,(canvas.width-w)/2,(canvas.height-h)/2,w,h)}
 video.style.visibility='hidden';stopCamera();
}
async function cameraLoop(now){
 if(!scanning||locked||mode!=='camera')return;
 if(job||now-lastFrame<430){raf=requestAnimationFrame(cameraLoop);return}
 const s=cameraShot();if(!s){raf=requestAnimationFrame(cameraLoop);return}
 lastFrame=now;const token=epoch;
 try{
  const r=await decode(s,'camera-'+(frameCount++%12));
  if(token!==epoch||!scanning||mode!=='camera')return;
  if(r.results?.length){locked=true;freezeCamera();showResults(r.results);return}
  status('Suche läuft · V1.1');
 }catch(e){if(token===epoch){hint(e.message);scanning=false}}
 if(scanning)raf=requestAnimationFrame(cameraLoop);
}
function fitPhoto(){
 if(!photo)return null;sizePreview();const W=canvas.width,H=canvas.height;
 const scale=Math.min(W/photo.width,H/photo.height)*photoZoom;
 return {scale,l:(W-photo.width*scale)/2+panX,t:(H-photo.height*scale)/2+panY,W,H};
}
function drawPhoto(){
 if(mode!=='photo')return;clearPreview();if(!photo)return;
 const q=fitPhoto();ctx.drawImage(photo,q.l,q.t,photo.width*q.scale,photo.height*q.scale);drawArea();
}
function makeCrop(sx,sy,w,h,max=2200){
 const scale=Math.min(1,max/Math.max(w,h));
 buffer.width=Math.max(1,Math.round(w*scale));buffer.height=Math.max(1,Math.round(h*scale));
 bctx.imageSmoothingEnabled=true;bctx.clearRect(0,0,buffer.width,buffer.height);
 bctx.drawImage(photo,sx,sy,w,h,0,0,buffer.width,buffer.height);return buffer;
}
function capturePhoto(whole){
 if(!photo)return null;
 if(whole)return makeCrop(0,0,photo.width,photo.height,2300);
 const q=fitPhoto();
 const x=Math.max(0,-q.l/q.scale),y=Math.max(0,-q.t/q.scale);
 const x2=Math.min(photo.width,(q.W-q.l)/q.scale),y2=Math.min(photo.height,(q.H-q.t)/q.scale);
 if(x2<=x||y2<=y)return null;
 return makeCrop(x,y,x2-x,y2-y,2600);
}
async function scanPhoto(whole,automatic=false){
 if(!photo||mode!=='photo')return;
 if(job){if(automatic)return;abortDecode()}
 const src=capturePhoto(whole);if(!src)return;
 const token=epoch;
 status('Suche im '+(whole?'Foto':'Ausschnitt')+' …');hint('Erkennung läuft, du kannst den Code auch direkt antippen.');
 try{
  const r=await decode(src,'photo-fast');if(token!==epoch||mode!=='photo')return;
  if(showResults(r.results))return;
  status('Kein Code gefunden · V1.1');hint('Falls kein Treffer: „Bereich markieren“ und den Code mit freiem Rand umrahmen.');
 }catch(e){if(token===epoch){status('Bildfehler · V1.1');hint(e.message)}}
}
async function scanSelected(){
 if(!photo||mode!=='photo'||!selectedArea||selectedArea.w<12||selectedArea.h<12)return;
 abortDecode();hideMatches();const token=epoch;const a=selectedArea;
 // Include ~12% of the marked size as a quiet zone on every side.
 const mx=Math.max(10,a.w*.12),my=Math.max(10,a.h*.12);
 const sx=Math.max(0,Math.floor(a.x-mx)),sy=Math.max(0,Math.floor(a.y-my));
 const ex=Math.min(photo.width,Math.ceil(a.x+a.w+mx)),ey=Math.min(photo.height,Math.ceil(a.y+a.h+my));
 const src=makeCrop(sx,sy,ex-sx,ey-sy,2600);
 status('Scanne gewählten Bereich …');hint('Suche in '+Math.round(ex-sx)+' × '+Math.round(ey-sy)+' Pixeln …');
 try{
  const r=await decode(src,'photo-area');if(token!==epoch||mode!=='photo')return;
  if(showResults(r.results)){clearArea();return}
  status('Bereich: kein Code · V1.1');
  hint('Kein Treffer nach '+(r.tries||0)+' Versuchen. Markiere den gesamten Code mit etwas freiem Rand.');
 }catch(e){if(token===epoch){status('Bereich: Fehler');hint(e.message)}}
}
function photoPoint(px,py){
 const q=fitPhoto(),rect=canvas.getBoundingClientRect();
 const x=(px-rect.left)*canvas.width/rect.width,y=(py-rect.top)*canvas.height/rect.height;
 return {x:(x-q.l)/q.scale,y:(y-q.t)/q.scale,cx:x,cy:y};
}
function focusAt(x,y){const q=$('focus'),r=canvas.getBoundingClientRect();q.style.left=(x/canvas.width*100)+'%';q.style.top=(y/canvas.height*100)+'%';q.classList.add('on')}
async function scanAt(px,py){
 if(!photo||mode!=='photo')return;
 const p=photoPoint(px,py);if(p.x<0||p.y<0||p.x>photo.width||p.y>photo.height)return;
 abortDecode();const token=epoch;hideMatches();focusAt(p.cx,p.cy);
 status('Untersuche angetippte Stelle …');hint('Suche direkt am markierten Bildbereich …');
 const side=Math.min(photo.width,photo.height);
 // Native-pixel crops are critical: never use the enlarged preview for decoding.
 const sizes=[90,145,230,360,Math.max(480,side*.24),Math.max(700,side*.46),Math.max(1000,side*.78)];
 let total=0;
 for(const wanted of [...new Set(sizes.map(s=>Math.round(s)))]){
  if(token!==epoch||mode!=='photo')return;
  const w=Math.min(photo.width,wanted),h=Math.min(photo.height,wanted);
  const sx=Math.max(0,Math.min(photo.width-w,Math.round(p.x-w/2))),sy=Math.max(0,Math.min(photo.height-h,Math.round(p.y-h/2)));
  const src=makeCrop(sx,sy,w,h,2000);
  try{
   const r=await decode(src,'photo-target');if(token!==epoch)return;
   total+=r.tries||0;
   if(showResults(r.results)){$('focus').classList.remove('on');return}
  }catch(e){if(token!==epoch)return;hint(e.message);break}
 }
 if(token!==epoch)return;
 status('Am Punkt kein Code · V1.1');hint('Noch kein Treffer. Bitte Bild vergrößern und genauer auf den Code tippen.');
 // Zoom around the tapped source point so a second tap can be more precise.
 if(photoZoom<2.2)setPhotoZoom(2.5,p.x,p.y);
}
function clampPan(){if(!photo)return;const w=canvas.width,h=canvas.height,base=Math.min(w/photo.width,h/photo.height)*photoZoom;
 const pw=photo.width*base,ph=photo.height*base;
 const mx=Math.max(0,(pw-w)/2+30),my=Math.max(0,(ph-h)/2+30);
 panX=Math.max(-mx,Math.min(mx,panX));panY=Math.max(-my,Math.min(my,panY));
}
function setPhotoZoom(v,anchorX,anchorY){
 if(!photo)return;
 const old=fitPhoto(),x=Number.isFinite(anchorX)?anchorX:photo.width/2,y=Number.isFinite(anchorY)?anchorY:photo.height/2;
 const locX=old.l+x*old.scale,locY=old.t+y*old.scale;
 photoZoom=Math.max(1,Math.min(12,Number(v)));
 const base=Math.min(canvas.width/photo.width,canvas.height/photo.height)*photoZoom;
 panX=locX-(canvas.width-photo.width*base)/2-x*base;
 panY=locY-(canvas.height-photo.height*base)/2-y*base;
 clampPan();$('photoRange').value=String(photoZoom);$('photoValue').textContent=photoZoom.toFixed(1).replace('.',',')+'×';drawPhoto();
}
async function pickPhoto(file){
 if(!file)return;abortDecode();clearArea();hideMatches();$('focus').classList.remove('on');
 const loadId=++photoLoadToken;const old=photo;photo=null;
 if(old&&typeof old.close==='function')old.close();
 clearPreview();status('Bild wird geöffnet …');
 try{
  let nextPhoto;
  if(window.createImageBitmap){nextPhoto=await createImageBitmap(file)}else{
   const url=URL.createObjectURL(file);try{nextPhoto=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=url})}finally{URL.revokeObjectURL(url)}
  }
  if(mode!=='photo'||loadId!==photoLoadToken){if(typeof nextPhoto.close==='function')nextPhoto.close();return}
  photo=nextPhoto;
  photoZoom=1;panX=0;panY=0;drawPhoto();status('Foto '+photo.width+'×'+photo.height+' · V1.1');
  hint('Suche startet. Falls kein Treffer: „Bereich markieren“ und Rechteck um den Code ziehen.');
  scanPhoto(true,true);
 }catch(e){status('Fotofehler');hint('Bild konnte nicht geöffnet werden: '+e.message)}
}
function setMode(next){
 abortDecode();stopCamera();clearArea();locked=false;mode=next;photoLoadToken++;if(photo&&typeof photo.close==='function')photo.close();photo=null;photoZoom=1;panX=panY=0;points.clear();origins.clear();$('focus').classList.remove('on');hideMatches();
 $('tabCamera').classList.toggle('selected',next==='camera');$('tabPhoto').classList.toggle('selected',next==='photo');
 $('cameraControls').hidden=next!=='camera';$('photoControls').hidden=next!=='photo';$('zoomCamera').hidden=next!=='camera';$('zoomPhoto').hidden=next!=='photo';
 viewer.classList.toggle('photo',next==='photo');video.style.display=next==='camera'?'block':'none';video.style.visibility='visible';clearPreview();
 hint(next==='camera'?'Kamera einschalten und „Scan starten“ drücken':'Foto öffnen; danach bei Bedarf „Bereich markieren“ verwenden.');status('ZXing bereit · V1.1');
}
$('tabCamera').onclick=()=>setMode('camera');$('tabPhoto').onclick=()=>setMode('photo');
$('cameraOn').onclick=openCamera;
$('startScan').onclick=async()=>{
 if(!cameraStream)await openCamera();if(!cameraStream||scanning)return;
 scanning=true;locked=false;lastFrame=0;hint('Suche läuft. Den Code möglichst scharf ins Bild halten.');raf=requestAnimationFrame(cameraLoop);
};
$('nextScan').onclick=openCamera;
$('cameraMinus').onclick=()=>setCameraZoom(camZoom-.5);$('cameraPlus').onclick=()=>setCameraZoom(camZoom+.5);$('camRange').oninput=e=>setCameraZoom(e.target.value);
$('pickPhoto').onclick=()=>$('file').click();$('file').onchange=e=>{pickPhoto(e.target.files?.[0]);e.target.value=''};
$('scanWhole').onclick=()=>scanPhoto(true);$('scanCrop').onclick=()=>scanPhoto(false);
$('selectArea').onclick=()=>{if(!photo){hint('Bitte erst ein Bild öffnen.');return}abortDecode();areaMode=!areaMode;$('selectArea').classList.toggle('active',areaMode);hint(areaMode?'Mit dem Finger ein Rechteck um den Code ziehen – mit etwas freiem Rand.':'Markierung kann über „Bereich scannen“ untersucht werden.')};
$('scanArea').onclick=scanSelected;$('clearArea').onclick=()=>{clearArea();hint('Markierung entfernt.')} ;
$('photoMinus').onclick=()=>setPhotoZoom(photoZoom/1.6);$('photoPlus').onclick=()=>setPhotoZoom(photoZoom*1.6);$('photoRange').oninput=e=>setPhotoZoom(e.target.value);
$('clearHistory').onclick=()=>{if(records.length&&confirm('Alle zehn bzw. alle vorhandenen Scans löschen?')){records=[];persist();render()}};
canvas.addEventListener('pointerdown',e=>{
 if(mode!=='photo'||!photo)return;
 e.preventDefault();canvas.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});origins.set(e.pointerId,{x:e.clientX,y:e.clientY,moved:false});
 if(areaMode){abortDecode();areaStart=photoCoords(e.clientX,e.clientY);setArea(areaStart,areaStart)}
});
canvas.addEventListener('pointermove',e=>{
 if(!points.has(e.pointerId)||mode!=='photo'||!photo)return;
 e.preventDefault();const p=points.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;points.set(e.pointerId,{x:e.clientX,y:e.clientY});
 const orig=origins.get(e.pointerId);if(orig&&Math.hypot(e.clientX-orig.x,e.clientY-orig.y)>8)orig.moved=true;
 if(areaMode&&areaStart){setArea(areaStart,photoCoords(e.clientX,e.clientY));return}
 if(points.size===1){const rect=canvas.getBoundingClientRect();panX+=dx*canvas.width/rect.width;panY+=dy*canvas.height/rect.height;clampPan();drawPhoto()}
 else if(points.size===2){const arr=[...points.values()],gap=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);if(lastGap>0){setPhotoZoom(photoZoom*gap/lastGap);for(const o of origins.values())o.moved=true}lastGap=gap}
});
for(const t of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(t,e=>{
 const orig=origins.get(e.pointerId);const tap=t==='pointerup'&&orig&&!orig.moved&&points.size===1;
 if(areaMode&&areaStart){if(t==='pointerup')setArea(areaStart,photoCoords(e.clientX,e.clientY));areaStart=null;points.delete(e.pointerId);origins.delete(e.pointerId);hint(selectedArea?.w>=12&&selectedArea?.h>=12?'Jetzt „Bereich scannen“ drücken.':'Mit dem Finger ein größeres Rechteck um den Code ziehen.');return}
 points.delete(e.pointerId);origins.delete(e.pointerId);if(points.size<2)lastGap=0;
 if(tap)scanAt(e.clientX,e.clientY);
});
canvas.addEventListener('wheel',e=>{if(mode==='photo'&&photo){e.preventDefault();setPhotoZoom(photoZoom*(e.deltaY<0?1.25:.8))}},{passive:false});
window.addEventListener('resize',()=>{if(mode==='photo')drawPhoto();else if(!cameraStream)clearPreview()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cameraStream){stopCamera();hint('Kamera gestoppt. Erneut einschalten.')}});
if('serviceWorker'in navigator&&location.protocol!=='file:'){
 const key='qr-v11-updated';let previouslyControlled=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(previouslyControlled&&!sessionStorage.getItem(key)){sessionStorage.setItem(key,'yes');location.reload()}});
 navigator.serviceWorker.register('./sw.js?v=1.1',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
}
setCameraZoom(1);status(typeof ScannerEngine==='object'?'ZXing bereit · V1.1':'Decoder fehlt · V1.1');
</script>
