<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101827"><title>QR Scanner Offline</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f2f6fc;font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{border:0;border-radius:11px;background:#33435e;color:white;padding:11px 13px;font-weight:600}button.primary{background:#3b82f6}button:disabled{opacity:.4}.app{height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 8px);gap:9px;max-width:650px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0}.modes{display:flex;gap:8px}.modes button{flex:1}.modes .selected{background:#3b82f6}.viewer{position:relative;flex:1;min-height:110px;overflow:hidden;border:1px solid #3a4b64;border-radius:14px;background:#050910;touch-action:none}video,.viewer canvas{width:100%;height:100%;object-fit:contain;display:block;position:absolute;inset:0}.viewer canvas{touch-action:none}.hint{position:absolute;bottom:8px;left:8px;right:8px;background:#101827bb;padding:7px;border-radius:8px;text-align:center;pointer-events:none;font-size:12px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{flex:1}.results{display:none;max-height:95px;overflow:auto;border:1px solid #4b5b75;border-radius:9px;padding:5px}.results button{display:block;width:100%;text-align:left;margin:3px 0;overflow-wrap:anywhere}.history{height:31%;min-height:160px;display:flex;flex-direction:column;gap:6px}.historyHead{display:flex;align-items:center;justify-content:space-between}.history h2{font-size:15px;margin:0}.historyHead button{padding:7px 11px;background:#793a44}.entries{overflow:auto;flex:1;border:1px solid #33435e;border-radius:10px}.entry{padding:8px;border-bottom:1px solid #33435e;display:grid;gap:5px}.meta{display:flex;justify-content:space-between;font-size:12px;color:#c0d0e8}.payload{overflow-wrap:anywhere;font-size:13px}.entry input{width:100%;background:#202d43;border:1px solid #455672;border-radius:6px;color:white;padding:7px}.empty{padding:20px;text-align:center;color:#a9bad1}.landscape{display:none}@media(orientation:landscape){.app{display:none}.landscape{display:grid;place-items:center;height:100dvh;padding:20px;text-align:center;font-size:20px}}@media(max-height:650px) and (orientation:portrait){.history{height:27%;min-height:130px}.app{gap:5px}button{padding:8px}}
 .versionFooter{text-align:center;font-size:11px;color:#8fa2bd;flex-shrink:0;line-height:1.1}</style></head><body><div class="landscape">Bitte das Gerät ins Hochformat drehen.</div><main class="app"><header><h1>QR Scanner</h1><small id="status">Offline bereit</small></header><div class="modes"><button class="selected" id="cameraMode">Kamera</button><button id="imageMode">Bild auswählen</button></div><div class="viewer" id="viewer"><video id="video" playsinline muted></video><canvas id="canvas"></canvas><div class="hint" id="hint">Kamera starten, dann „Scan starten“ drücken</div></div><div class="toolbar"><button id="openCamera">Kamera einschalten</button><button class="primary" id="scan">Scan starten</button><button id="reset">Weiter</button><button id="chooseImage" hidden>Bild öffnen</button><button id="analyze" hidden>Bereich scannen</button><button id="zoomIn" hidden>＋</button><button id="zoomOut" hidden>－</button></div><input id="file" type="file" accept="image/*" hidden><div class="results" id="results"></div><section class="history"><div class="historyHead"><h2>Letzte Scans (<span id="count">0</span>/10)</h2><button id="clear">Alle löschen</button></div><div class="entries" id="entries"></div></section><footer class="versionFooter">QR Scanner · V0.1</footer></main><script>
const $=id=>document.getElementById(id), video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),viewer=$('viewer');let detector,stream,mode='camera',active=false,locked=false,frame=0,img=null,zoom=1,panX=0,panY=0,drag=null;let records=JSON.parse(localStorage.getItem('qrRecords')||'[]'),seq=Number(localStorage.getItem('qrSeq')||0);const supported='BarcodeDetector' in window;
function status(t){$('status').textContent=t}function hint(t){$('hint').textContent=t}function persist(){localStorage.setItem('qrRecords',JSON.stringify(records));localStorage.setItem('qrSeq',seq)}function render(){ $('count').textContent=records.length;$('entries').replaceChildren();if(!records.length){$('entries').innerHTML='<div class="empty">Noch keine Scans</div>';return}for(const r of [...records].reverse()){const e=document.createElement('div');e.className='entry';const meta=document.createElement('div');meta.className='meta';meta.textContent=`#${r.id} · ${r.time}`;const val=document.createElement('div');val.className='payload';val.textContent=r.value;const input=document.createElement('input');input.placeholder='Bemerkung eingeben';input.value=r.note||'';input.addEventListener('input',()=>{r.note=input.value;persist()});e.append(meta,val,input);$('entries').append(e)}}render();
async function initDetector(){if(!supported){hint('Dieser Browser unterstützt die QR-Erkennung (BarcodeDetector) nicht. Bitte Safari/Chrome in aktueller Version versuchen.');status('Erkennung nicht verfügbar');return false}try{detector=new BarcodeDetector({formats:['qr_code']});return true}catch(e){hint('QR-Erkennung nicht verfügbar: '+e.message);return false}}
function stopCamera(){active=false;cancelAnimationFrame(frame);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}function resizeCanvas(){canvas.width=Math.max(1,Math.round(viewer.clientWidth*devicePixelRatio));canvas.height=Math.max(1,Math.round(viewer.clientHeight*devicePixelRatio))}function clearCanvas(){resizeCanvas();ctx.clearRect(0,0,canvas.width,canvas.height)}
async function startCamera(){stopCamera();img=null;locked=false;clearCanvas();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();hint('Auf „Scan starten“ tippen');status('Kamera bereit')}catch(e){hint('Kamera nicht verfügbar: '+e.message);status('Kamerafehler')}}
function drawFrame(){if(!video.videoWidth)return;resizeCanvas();const w=canvas.width,h=canvas.height,vw=video.videoWidth,vh=video.videoHeight,s=Math.min(w/vw,h/vh),dw=vw*s,dh=vh*s;ctx.drawImage(video,(w-dw)/2,(h-dh)/2,dw,dh)}
async function detect(source){if(!detector&&!(await initDetector()))return[];try{return await detector.detect(source)}catch(e){status('Scanfehler');return[]}}
function drawMarks(found){ctx.lineWidth=4*devicePixelRatio;ctx.strokeStyle='#51f0a4';for(const r of found){const p=r.cornerPoints;if(!p?.length)continue;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();ctx.stroke()}}
function options(found){const unique=[...new Map(found.map(x=>[x.rawValue,x])).values()];$('results').replaceChildren();if(unique.length===1){save(unique[0].rawValue);return}if(unique.length>1){$('results').style.display='block';hint(`${unique.length} QR-Codes gefunden – bitte auswählen`);unique.forEach((r,i)=>{const b=document.createElement('button');b.textContent=`Code ${i+1}: ${r.rawValue.slice(0,100)}`;b.onclick=()=>save(r.rawValue);$('results').append(b)})}else hint('Kein QR-Code gefunden. Ausschnitt ändern oder erneut scannen.')}
function save(value){if(!value)return;seq++;records.push({id:seq,time:new Date().toLocaleString('de-DE'),value,note:''});records=records.slice(-10);persist();render();$('results').style.display='none';hint('Scan gespeichert – „Weiter“ für nächsten Scan');status('Erkannt')}
async function loop(){if(!active||locked)return;drawFrame();const found=await detect(canvas);if(found.length){locked=true;active=false;drawMarks(found);stopCamera();options(found);return}frame=requestAnimationFrame(loop)}
function showImage(){clearCanvas();if(!img)return;const w=canvas.width,h=canvas.height,s=Math.min(w/img.width,h/img.height)*zoom,dw=img.width*s,dh=img.height*s;ctx.drawImage(img,(w-dw)/2+panX,(h-dh)/2+panY,dw,dh)}
function switchMode(m){stopCamera();mode=m;locked=false;img=null;$('results').style.display='none';$('results').replaceChildren();$('cameraMode').classList.toggle('selected',m==='camera');$('imageMode').classList.toggle('selected',m==='image');for(const id of ['openCamera','scan','reset'])$(id).hidden=m!=='camera';for(const id of ['chooseImage','analyze','zoomIn','zoomOut'])$(id).hidden=m!=='image';video.style.display=m==='camera'?'block':'none';clearCanvas();hint(m==='camera'?'Kamera einschalten':'Bild öffnen, mit zwei Fingern zoomen oder verschieben')}
$('cameraMode').onclick=()=>switchMode('camera');$('imageMode').onclick=()=>switchMode('image');$('openCamera').onclick=startCamera;$('scan').onclick=async()=>{if(!stream)await startCamera();if(!stream)return;locked=false;active=true;hint('Suche nach QR-Codes …');loop()};$('reset').onclick=startCamera;$('chooseImage').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{img=await createImageBitmap(f);zoom=1;panX=panY=0;showImage();hint('Ausschnitt zoomen/verschieben und „Bereich scannen“ drücken')}catch(err){hint('Bild konnte nicht geöffnet werden')}e.target.value=''};$('analyze').onclick=async()=>{if(!img)return;showImage();const found=await detect(canvas);showImage();drawMarks(found);options(found)};$('zoomIn').onclick=()=>{zoom=Math.min(zoom*1.5,12);showImage()};$('zoomOut').onclick=()=>{zoom=Math.max(zoom/1.5,1);showImage()};
let touches=[];canvas.addEventListener('pointerdown',e=>{if(mode!=='image')return;canvas.setPointerCapture(e.pointerId);touches.push({id:e.pointerId,x:e.clientX,y:e.clientY})});canvas.addEventListener('pointermove',e=>{if(mode!=='image')return;const i=touches.findIndex(t=>t.id===e.pointerId);if(i<0)return;const old=touches[i];panX+=(e.clientX-old.x)*devicePixelRatio;panY+=(e.clientY-old.y)*devicePixelRatio;touches[i]={id:e.pointerId,x:e.clientX,y:e.clientY};showImage()});for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,e=>{touches=touches.filter(t=>t.id!==e.pointerId)});canvas.addEventListener('wheel',e=>{if(mode!=='image')return;e.preventDefault();zoom=Math.max(1,Math.min(12,zoom*(e.deltaY<0?1.15:1/1.15)));showImage()},{passive:false});let pinch=0;viewer.addEventListener('touchmove',e=>{if(mode!=='image'||e.touches.length!==2){pinch=0;return}e.preventDefault();const [a,b]=e.touches,d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)zoom=Math.max(1,Math.min(12,zoom*d/pinch));pinch=d;showImage()},{passive:false});viewer.addEventListener('touchend',()=>pinch=0);
$('clear').onclick=()=>{if(records.length&&confirm('Alle 10 beziehungsweise vorhandenen Scans löschen?')){records=[];persist();render()}};window.addEventListener('resize',()=>{if(mode==='image')showImage();else if(!active&&!stream)clearCanvas()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream)stopCamera()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});if(!supported)initDetector();
</script></body></html>
