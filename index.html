<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QR Scanner">
<title>QR & Data Matrix Scanner V0.9</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#101827;color:#f2f6fc;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;border-radius:10px;background:#33435e;color:#fff;padding:10px 9px;font-weight:600;min-height:40px}button.primary,.modes button.selected{background:#3078e6}button:disabled{opacity:.45}.app{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 11px calc(env(safe-area-inset-bottom) + 7px);max-width:650px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:19px;margin:0}#status{font-size:11px;text-align:right;color:#b9cdeb;overflow-wrap:anywhere;max-width:63%}.modes,.toolbar{display:flex;gap:7px}.modes button{flex:1}.toolbar{flex-wrap:wrap}.toolbar button{flex:1 1 auto;white-space:nowrap;font-size:13px}.toolbar [hidden]{display:none}.viewer{position:relative;flex:1;min-height:110px;overflow:hidden;border:1px solid #42536e;border-radius:13px;background:#050910;touch-action:none}#video,#canvas{width:100%;height:100%;position:absolute;inset:0;object-fit:contain;display:block}#canvas{pointer-events:auto;touch-action:none}#video{z-index:0}#canvas{z-index:1}.hint{position:absolute;bottom:7px;left:7px;right:7px;background:#111c30d8;border-radius:7px;padding:7px;text-align:center;font-size:12px;pointer-events:none;z-index:2}.busy{display:none;position:absolute;top:8px;right:8px;background:#253e68dd;border-radius:7px;padding:5px 8px;font-size:12px;z-index:2}.busy.visible{display:block}.results{display:none;max-height:114px;overflow:auto;border:1px solid #4b5b75;border-radius:9px;padding:5px}.results button{display:block;text-align:left;width:100%;margin:3px 0;overflow-wrap:anywhere}.history{height:29%;min-height:142px;display:flex;flex-direction:column;gap:5px}.historyHead{display:flex;align-items:center;justify-content:space-between}.historyHead h2{font-size:14px;margin:0}.historyHead button{background:#793a44;padding:5px 10px;min-height:32px;font-size:12px}.entries{overflow:auto;flex:1;border:1px solid #34445d;border-radius:9px}.entry{display:grid;gap:4px;padding:7px;border-bottom:1px solid #33435e}.meta{display:flex;gap:8px;justify-content:space-between;color:#becde0;font-size:12px}.payload{font-size:13px;overflow-wrap:anywhere}.entry input{width:100%;background:#202d43;border:1px solid #455672;border-radius:6px;color:#fff;padding:6px;font-size:13px}.empty{padding:15px;text-align:center;color:#a9bad1}.versionFooter{text-align:center;font-size:11px;color:#8fa2bd;flex-shrink:0}.cameraZoom{display:flex;align-items:center;gap:7px;background:#1b283e;border-radius:9px;padding:5px 7px}.cameraZoom label{font-size:12px;white-space:nowrap}.cameraZoom input{flex:1;min-width:45px;accent-color:#3988ff}.cameraZoom output{font-size:12px;min-width:34px;text-align:right;white-space:nowrap}.cameraZoom button{width:33px;min-height:31px;padding:3px}.cameraZoom[hidden]{display:none}.landscape{display:none}@media(orientation:landscape) and (pointer:coarse){.app{display:none}.landscape{height:100dvh;display:grid;place-items:center;padding:20px;text-align:center;font-size:19px}}@media(max-height:690px) and (orientation:portrait){.app{gap:5px}.history{height:27%;min-height:110px}.toolbar button{padding:6px 8px;min-height:33px}.modes button{min-height:34px}.hint{font-size:11px;padding:5px}}
</style>
</head>
<body>
<div class="landscape">Bitte das Gerät ins Hochformat drehen.</div>
<main class="app">
<header><h1>QR Scanner</h1><small id="status">Starte Erkennung …</small></header>
<div class="modes"><button id="cameraMode" class="selected">Kamera</button><button id="imageMode">Bild auswählen</button></div>
<div class="viewer" id="viewer">
<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="busy" class="busy">Prüfe Bild …</div>
<div class="hint" id="hint">Kamera einschalten und „Scan starten“ drücken</div>
</div>
<div class="toolbar">
<button id="openCamera">Kamera einschalten</button><button class="primary" id="scan">Scan starten</button><button id="reset">Weiter</button>
<button id="chooseImage" hidden>Bild öffnen</button><button id="scanWhole" hidden>Ganzes Bild</button><button class="primary" id="analyze" hidden>Ausschnitt scannen</button><button id="zoomOut" hidden>−</button><button id="zoomIn" hidden>＋</button><button id="resetZoom" hidden>1:1</button>
</div>
<div class="cameraZoom" id="cameraZoomBar">
  <button id="camZoomMinus" aria-label="Kamera verkleinern">−</button>
  <label for="camZoom">Kamera-Zoom</label>
  <input id="camZoom" type="range" min="1" max="5" step="0.1" value="1" aria-label="Kamera-Zoom">
  <button id="camZoomPlus" aria-label="Kamera vergrößern">＋</button>
  <output id="camZoomVal" for="camZoom">1,0×</output>
</div>
<input id="file" type="file" accept="image/*" hidden>
<div class="results" id="results"></div>
<section class="history"><div class="historyHead"><h2>Letzte Scans (<span id="count">0</span>/10)</h2><button id="clear">Alle löschen</button></div><div class="entries" id="entries"></div></section>
<footer class="versionFooter">QR & Data Matrix · V0.9</footer>
</main>
<script src="zxing.min.js?v=0.9"></script>
<script src="scanner-engine.js?v=0.9"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const viewer=$('viewer'),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),video=$('video');
const workCanvas=document.createElement('canvas'),workCtx=workCanvas.getContext('2d',{willReadFrequently:true});
const VERSION='V0.9';
let cameraScanCount=0;let stream=null,mode='camera',scanning=false,locked=false,frame=0,previousFrame=0,workerBusy=false,busyCount=0;
let image=null,zoom=1,panX=0,panY=0,gesture=new Map(),lastPinch=0,pointerOrigin=new Map();
let cameraZoom=1, imageToken=0;
let seq=0,records=[];
try{records=JSON.parse(localStorage.getItem('qrRecords')||'[]');seq=Number(localStorage.getItem('qrSeq')||0);if(!Array.isArray(records))records=[]}catch(err){records=[]}
let worker=null,taskNumber=0,taskWait=new Map(),generation=0;
function setStatus(s){$('status').textContent=s}function setHint(s){$('hint').textContent=s}
function setBusy(v){$('busy').classList.toggle('visible',v);$('analyze').disabled=v;$('scanWhole').disabled=v}
function persist(){try{localStorage.setItem('qrRecords',JSON.stringify(records));localStorage.setItem('qrSeq',String(seq))}catch(err){setStatus('Speichern nicht möglich · '+VERSION)}}
function renderHistory(){
 $('count').textContent=records.length;const target=$('entries');target.replaceChildren();
 if(!records.length){const el=document.createElement('div');el.className='empty';el.textContent='Noch keine Scans';target.append(el);return}
 for(const rec of [...records].reverse()){
  const e=document.createElement('div');e.className='entry';
  const meta=document.createElement('div');meta.className='meta';meta.textContent='#'+rec.id+' · '+rec.time+(rec.format?' · '+rec.format:'');
  const payload=document.createElement('div');payload.className='payload';payload.textContent=rec.value;
  const note=document.createElement('input');note.placeholder='Bemerkung';note.value=rec.note||'';note.addEventListener('input',()=>{rec.note=note.value;persist()});
  e.append(meta,payload,note);target.append(e);
 }
}
renderHistory();
function initWorker(){
 try{
  worker=new Worker('./scan-worker.js?v=0.9');
  worker.onmessage=e=>{const t=taskWait.get(e.data.id);if(!t)return;taskWait.delete(e.data.id);e.data.error?t.reject(new Error(e.data.error)):t.resolve(e.data)};
  worker.onerror=e=>{for(const task of taskWait.values())task.reject(new Error('Decoder-Worker: '+e.message));taskWait.clear();worker.terminate();worker=null;setStatus('Lokaler Decoder aktiv · '+VERSION)};
 }catch(err){worker=null}
}
initWorker();
function decodeCurrent(source,profile){
 const W=source.width,H=source.height;const pixels=source.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H);
 if(!worker){return new Promise((resolve,reject)=>{setTimeout(()=>{try{resolve(ScannerEngine.scan(pixels.data,W,H,profile))}catch(e){reject(e)}},0)})}
 const id=++taskNumber;
 return new Promise((resolve,reject)=>{taskWait.set(id,{resolve,reject});worker.postMessage({id,data:pixels.data.buffer,width:W,height:H,profile},[pixels.data.buffer])});
}
function resizeCanvas(){const r=viewer.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*devicePixelRatio));canvas.height=Math.max(1,Math.round(r.height*devicePixelRatio))}
function clearCanvas(){resizeCanvas();ctx.clearRect(0,0,canvas.width,canvas.height)}
function stopCamera(){generation++;scanning=false;cancelAnimationFrame(frame);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
async function startCamera(){
 stopCamera();image=null;locked=false;video.style.visibility='visible';clearCanvas();setStatus('Kamera wird geöffnet …');
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Kamera benötigt HTTPS bzw. localhost');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();setCameraZoom(cameraZoom);setHint('Zoom einstellen, dann „Scan starten“ drücken');setStatus('Kamera bereit · '+VERSION);
 }catch(err){setHint('Kamera nicht verfügbar: '+err.message);setStatus('Kamerafehler · '+VERSION)}
}
function setCameraZoom(next){
 cameraZoom=Math.max(1,Math.min(5,Math.round(Number(next)*10)/10));
 $('camZoom').value=String(cameraZoom);
 $('camZoomVal').textContent=cameraZoom.toFixed(1).replace('.',',')+'×';
 // Digital zoom is always available: CSS preview and decoder use the same central region.
 video.style.transform='scale('+cameraZoom+')';
 video.style.transformOrigin='center center';
}
function cameraCapture(){
 if(!video.videoWidth||!video.videoHeight)return null;
 const sw=video.videoWidth/cameraZoom, sh=video.videoHeight/cameraZoom;
 const sx=(video.videoWidth-sw)/2, sy=(video.videoHeight-sh)/2;
 // Keep native pixel detail for distant codes, instead of enlarging low-res previews.
 const factor=Math.min(1,1600/Math.max(sw,sh));
 workCanvas.width=Math.max(1,Math.round(sw*factor));workCanvas.height=Math.max(1,Math.round(sh*factor));
 workCtx.imageSmoothingEnabled=true;
 workCtx.drawImage(video,sx,sy,sw,sh,0,0,workCanvas.width,workCanvas.height);return workCanvas;
}
function imageCoords(){
 if(!image)return null;
 const w=canvas.width,h=canvas.height,scale=Math.min(w/image.width,h/image.height)*zoom;
 const l=(w-image.width*scale)/2+panX,t=(h-image.height*scale)/2+panY;
 const sx=Math.max(0,-l/scale),sy=Math.max(0,-t/scale);
 const ex=Math.min(image.width,(w-l)/scale),ey=Math.min(image.height,(h-t)/scale);
 if(ex<=sx||ey<=sy)return null;
 return {sx,sy,w:ex-sx,h:ey-sy,scale,l,t};
}
function imageCapture(whole=false){
 if(!image)return null;
 const c=whole?{sx:0,sy:0,w:image.width,h:image.height}:imageCoords();if(!c)return null;
 const factor=Math.min(1,2400/Math.max(c.w,c.h));
 workCanvas.width=Math.max(1,Math.round(c.w*factor));workCanvas.height=Math.max(1,Math.round(c.h*factor));
 workCtx.imageSmoothingEnabled=true;
 workCtx.drawImage(image,c.sx,c.sy,c.w,c.h,0,0,workCanvas.width,workCanvas.height);
 return workCanvas;
}
function drawImagePreview(){clearCanvas();if(!image)return;const c=imageCoords();if(!c)return;ctx.drawImage(image,c.l,c.t,image.width*c.scale,image.height*c.scale)}
function freezeCamera(){
 if(!stream)return;
 const shot=cameraCapture();if(!shot)return;
 resizeCanvas();ctx.fillStyle='#050910';ctx.fillRect(0,0,canvas.width,canvas.height);
 const s=Math.min(canvas.width/shot.width,canvas.height/shot.height),dw=shot.width*s,dh=shot.height*s;
 ctx.drawImage(shot,(canvas.width-dw)/2,(canvas.height-dh)/2,dw,dh);
 video.style.visibility='hidden';stopCamera();
}
function saveResult(res){
 if(!res||!res.value)return;
 seq++;records.push({id:seq,time:new Date().toLocaleString('de-DE'),value:res.value.replace(/[\r\n]+$/g,''),format:res.format,note:''});
 records=records.slice(-10);persist();renderHistory();$('results').style.display='none';setHint('Erkannt und gespeichert. Für nächsten Scan „Weiter“ drücken.');setStatus('Code gespeichert · '+VERSION);
}
function showMatches(matches){
 const panel=$('results');panel.replaceChildren();panel.style.display='none';
 if(!matches.length){setHint(mode==='image'?'Kein Code gefunden. Bitte direkt auf den Code im Foto tippen oder Ausschnitt vergrößern.':'Kein Code gefunden. Kamera-Zoom erhöhen, ruhig halten und gutes Licht nutzen.');return}
 if(matches.length===1){saveResult(matches[0]);return}
 panel.style.display='block';setHint(matches.length+' Codes erkannt – gewünschten Eintrag auswählen');
 matches.forEach((result,i)=>{const button=document.createElement('button');button.textContent=(i+1)+'. '+result.format+': '+result.value.slice(0,110);button.onclick=()=>saveResult(result);panel.append(button)});
}
async function cameraLoop(now=0){
 if(!scanning||locked||mode!=='camera')return;
 if(workerBusy||now-previousFrame<450){frame=requestAnimationFrame(cameraLoop);return}
 const shot=cameraCapture();if(!shot){frame=requestAnimationFrame(cameraLoop);return}
 previousFrame=now;workerBusy=true;const myGeneration=generation;
 try{
  const r=await decodeCurrent(shot,'camera-'+(cameraScanCount++%12));
  if(myGeneration!==generation||!scanning||mode!=='camera')return;
  if(r.results.length){locked=true;freezeCamera();setStatus(r.results.length+' Code(s) erkannt · '+VERSION);showMatches(r.results);return}
  setStatus('Suche läuft · '+r.tries+' Prüfungen · '+VERSION);
 }catch(err){setStatus('Erkennungsfehler · '+VERSION);setHint(err.message);scanning=false}
 finally{workerBusy=false}
 if(scanning)frame=requestAnimationFrame(cameraLoop);
}
async function scanImage(whole){
 if(!image||workerBusy)return;
 const source=imageCapture(whole);if(!source){setHint('Ungültiger Bildausschnitt');return}
 workerBusy=true;setBusy(true);const myGeneration=generation;
 setStatus('Prüfe '+source.width+'×'+source.height+' · '+VERSION);
 try{
  const r=await decodeCurrent(source,'image');
  if(myGeneration!==generation||mode!=='image')return;
  setStatus(r.results.length?r.results.length+' Code(s) erkannt · '+VERSION:'Kein Code · '+r.tries+' Prüfungen · '+VERSION);
  showMatches(r.results);
 }catch(err){setStatus('Scanfehler · '+VERSION);setHint(err.message)}
 finally{workerBusy=false;setBusy(false)}
}
function switchMode(next){
 stopCamera();mode=next;locked=false;image=null;zoom=1;panX=panY=0;
 imageToken++;$('results').style.display='none';$('results').replaceChildren();
 $('cameraMode').classList.toggle('selected',next==='camera');$('imageMode').classList.toggle('selected',next==='image');
 $('cameraZoomBar').hidden=next!=='camera';
 for(const id of ['openCamera','scan','reset'])$(id).hidden=next!=='camera';
 for(const id of ['chooseImage','scanWhole','analyze','zoomOut','zoomIn','resetZoom'])$(id).hidden=next!=='image';
 video.style.display=next==='camera'?'block':'none';clearCanvas();
 setHint(next==='camera'?'Kamera einschalten, bei Bedarf zoomen, dann Scan starten':'Foto laden – automatische Suche oder auf den Code tippen');
 setStatus('Erkennung bereit · '+VERSION);
}
$('camZoom').addEventListener('input',e=>setCameraZoom(e.target.value));
$('camZoomMinus').onclick=()=>setCameraZoom(cameraZoom-.5);
$('camZoomPlus').onclick=()=>setCameraZoom(cameraZoom+.5);
$('cameraMode').onclick=()=>switchMode('camera');$('imageMode').onclick=()=>switchMode('image');
$('openCamera').onclick=startCamera;
$('scan').onclick=async()=>{
 if(!stream)await startCamera();if(!stream||scanning)return;
 locked=false;scanning=true;previousFrame=0;setHint('Suche läuft – Code möglichst groß und scharf ins Bild halten');frame=requestAnimationFrame(cameraLoop);
};
$('reset').onclick=async()=>{await startCamera()};
$('chooseImage').onclick=()=>$('file').click();
// For a tiny symbol in a large photo, tap its center to examine local regions.
async function scanImageAt(clientX,clientY){
 if(!image||mode!=='image'||workerBusy)return;
 const rect=canvas.getBoundingClientRect();const c=imageCoords();if(!c)return;
 const bx=(clientX-rect.left)*canvas.width/rect.width,by=(clientY-rect.top)*canvas.height/rect.height;
 const centerX=(bx-c.l)/c.scale,centerY=(by-c.t)/c.scale;
 if(centerX<0||centerY<0||centerX>image.width||centerY>image.height)return;
 workerBusy=true;setBusy(true);const myGeneration=generation;
 setStatus('Prüfe angetippten Bereich · '+VERSION);
 try{
  let count=0;
  const side=Math.min(image.width,image.height);
  const sizes=[Math.max(65,side*.09),Math.max(110,side*.17),Math.max(200,side*.32),Math.max(350,side*.58)];
  for(const wanted of sizes){
   if(myGeneration!==generation||mode!=='image')return;
   const w=Math.min(image.width,Math.round(wanted)),h=Math.min(image.height,Math.round(wanted));
   const sx=Math.max(0,Math.min(image.width-w,Math.round(centerX-w/2)));
   const sy=Math.max(0,Math.min(image.height-h,Math.round(centerY-h/2)));
   const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;
   tmp.getContext('2d',{willReadFrequently:true}).drawImage(image,sx,sy,w,h,0,0,w,h);
   const found=await decodeCurrent(tmp,'image');count+=found.tries;
   if(found.results.length){setStatus(found.results.length+' Code(s) erkannt · '+VERSION);showMatches(found.results);return}
  }
  setStatus('Kein Code am Punkt · '+count+' Prüfungen · '+VERSION);
  setHint('Noch nicht erkannt: näher auf den Code tippen oder Foto vergrößern und „Ausschnitt scannen“ wählen.');
 }catch(err){setStatus('Bildfehler · '+VERSION);setHint(err.message)}
 finally{workerBusy=false;setBusy(false)}
}
$('file').onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 generation++;setStatus('Lade Foto …');
 try{
  if(image&&typeof image.close==='function')image.close();
  if(typeof createImageBitmap==='function')image=await createImageBitmap(f);
  else{
   const url=URL.createObjectURL(f);
   try{image=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url})}
   finally{URL.revokeObjectURL(url)}
  }
  zoom=1;panX=panY=0;drawImagePreview();setStatus('Foto '+image.width+'×'+image.height+' · '+VERSION);
  setHint('Automatische Suche startet. Wenn erfolglos: direkt auf den Code im Foto tippen.');
  const thisToken=++imageToken;
  setTimeout(()=>{if(thisToken===imageToken&&image&&mode==='image'&&!workerBusy)scanImage(true)},120);
 }catch(err){setHint('Foto konnte nicht geöffnet werden: '+err.message);setStatus('Bildfehler · '+VERSION)}
 e.target.value='';
};
$('scanWhole').onclick=()=>scanImage(true);$('analyze').onclick=()=>scanImage(false);
function setZoom(z){zoom=Math.max(1,Math.min(16,z));if(zoom===1){panX=0;panY=0}drawImagePreview()}
$('zoomIn').onclick=()=>setZoom(zoom*1.7);$('zoomOut').onclick=()=>setZoom(zoom/1.7);$('resetZoom').onclick=()=>setZoom(1);
canvas.addEventListener('pointerdown',e=>{
 if(mode!=='image'||!image)return;
 canvas.setPointerCapture(e.pointerId);gesture.set(e.pointerId,{x:e.clientX,y:e.clientY});pointerOrigin.set(e.pointerId,{x:e.clientX,y:e.clientY,moved:false});
});
canvas.addEventListener('pointermove',e=>{
 if(mode!=='image'||!image||!gesture.has(e.pointerId))return;
 const p=gesture.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;
 gesture.set(e.pointerId,{x:e.clientX,y:e.clientY});
 const start=pointerOrigin.get(e.pointerId);if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>9)start.moved=true;
 if(gesture.size===1){panX+=dx*devicePixelRatio;panY+=dy*devicePixelRatio;drawImagePreview()}
 else if(gesture.size===2){const [a,b]=[...gesture.values()],dist=Math.hypot(a.x-b.x,a.y-b.y);if(lastPinch>0)setZoom(zoom*dist/lastPinch);lastPinch=dist}
});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>{
 const origin=pointerOrigin.get(e.pointerId);const tap=name==='pointerup'&&origin&&!origin.moved&&gesture.size===1;
 gesture.delete(e.pointerId);pointerOrigin.delete(e.pointerId);if(gesture.size<2)lastPinch=0;
 if(tap)scanImageAt(e.clientX,e.clientY);
});
canvas.addEventListener('wheel',e=>{if(mode!=='image')return;e.preventDefault();setZoom(zoom*(e.deltaY<0?1.25:.8))},{passive:false});
$('clear').onclick=()=>{if(records.length&&confirm('Alle gespeicherten Scans löschen?')){records=[];persist();renderHistory()}};
window.addEventListener('resize',()=>{if(mode==='image')drawImagePreview();else if(!stream)clearCanvas()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream){stopCamera();setHint('Kamera gestoppt – für nächsten Scan erneut einschalten')}});
if('serviceWorker' in navigator&&location.protocol!=='file:'){
 const key='qr-v09-updated';let had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!sessionStorage.getItem(key)){sessionStorage.setItem(key,'yes');location.reload()}});
 navigator.serviceWorker.register('./sw.js?v=0.9',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
}
setCameraZoom(1);setStatus(typeof ScannerEngine==='object'?'ZXing bereit · '+VERSION:'Decoder fehlt · '+VERSION);
</script>
</body></html>
